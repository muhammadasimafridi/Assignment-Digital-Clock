<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta n e="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      width: 100%;
      height: auto;
      background-color: black;
    }
    h1{
      margin: 75px 0 25px 0;   
      color: white;
      font-weight: 900;
      font-size: 40px;
    }
    .clock{
      font-weight: 900;
      font-size: 35px;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Digital Clock App</h1>
  <div class="clock"></div>

  <script>
    function timeFunc() {
      let time;
      let now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();


      if(hours < 10) hours = "0" + hours;
      if(minutes < 10) minutes = "0" + minutes;
      if(seconds < 10) seconds = "0" + seconds;

      time = hours + ":" + minutes + ":" + seconds;
      document.querySelector(".clock").textContent = time;
    }
    setInterval(timeFunc, 1000);
    timeFunc();
  </script>
  
</body>
</html>
